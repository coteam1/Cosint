name: Bootstrap
on: workflow_dispatch

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack archive
        shell: bash
        run: |
          set -euo pipefail
          test -f Cosint.zip || { echo "Cosint.zip غير موجود في جذر المستودع"; exit 1; }
          unzip -q Cosint.zip
          shopt -s dotglob
          mv Cosint/* .
          rm -rf Cosint Cosint.zip .github/workflows/bootstrap.yml

      - name: Commit
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bootstrap Cosint: Docker and Vercel editions"
          git push
